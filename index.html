function u(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
async function open(pw){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));
  return new TextDecoder().decode(pt);
}
async function go(pw,silent){
  try{var h=await open(pw);try{sessionStorage.setItem('vdc_pw',pw)}catch(e){}document.open();document.write(h);document.close()}
  catch(e){if(!silent)document.getElementById('e').textContent='Contraseña incorrecta'}
}
